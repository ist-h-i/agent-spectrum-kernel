<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UI/UX Design Harness fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #171717; background: #f7f7f7; }
    main { max-width: 880px; margin: 0 auto; padding: 24px; }
    section { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 18px; margin: 16px 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, button { font: inherit; }
    input { padding: 8px; width: min(360px, 100%); }
    button { padding: 8px 12px; margin: 4px 4px 4px 0; }
    button:focus-visible, input:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }
    [role="status"], [role="alert"] { margin: 8px 0; }
    .muted { opacity: .75; }
    .selected { font-weight: 700; text-decoration: underline; }
    #foundation-block { border: 3px solid currentColor; background: white; padding: 24px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>通知設定</h1>
  <p class="muted">状態遷移と復旧境界を確認するための authored demonstration です。モデル効果の証拠ではありません。</p>

  <div id="foundation-block" role="alert" hidden>
    <h2>この画面を利用できません</h2>
    <p id="foundation-reason"></p>
    <p>権限とデータ整合性を確認してから再読み込みしてください。</p>
    <button id="restore-foundation">検証用: 復旧</button>
  </div>

  <div id="app-content">
    <section id="edit-view">
      <h2>設定を編集</h2>
      <form id="settings-form" novalidate>
        <label for="name">設定名</label>
        <input id="name" name="name" autocomplete="off" />
        <p id="name-error" role="alert"></p>
        <button id="save" type="submit">設定を保存</button>
        <p id="submit-status" role="status" aria-live="polite"></p>
        <button id="next-action" type="button" hidden>一覧へ戻る</button>
      </form>

      <h3>対象</h3>
      <div id="selection" role="group" aria-label="対象を選択"></div>
      <button id="open-details" type="button">選択中の詳細を見る</button>
    </section>

    <section id="details-view" hidden>
      <h2>詳細</h2>
      <p id="current-selection"></p>
      <button id="back" type="button">編集に戻る</button>
    </section>

    <section>
      <h2>可逆操作</h2>
      <ul id="rows"></ul>
      <button id="remove-alpha" type="button">alpha を非表示</button>
      <button id="undo" type="button" hidden>元に戻す</button>
    </section>

    <section>
      <h2>不可逆操作</h2>
      <button id="open-confirm" type="button">API連携を完全に削除</button>
      <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
        <h3 id="confirm-title">API連携 alpha を完全に削除しますか？</h3>
        <p>対象: API連携 alpha。保存済みの認証設定を削除します。このfixtureでは削除後に元へ戻せません。</p>
        <button id="cancel-delete" type="button">削除せず戻る</button>
        <button id="commit-delete" type="button">完全に削除</button>
      </div>
      <p id="delete-status" role="status"></p>
    </section>

    <section id="metrics-region">
      <h2>集計</h2>
      <p id="metrics-status" role="status"></p>
      <p>合計: <strong id="total"></strong></p>
      <button id="dependent-action" type="button">集計結果を使う</button>
      <button id="retry-metrics" type="button" hidden>集計だけ再試行</button>
      <button id="fail-metrics" type="button">検証用: 取得失敗</button>
      <button id="missing-metrics" type="button">検証用: 欠測</button>
    </section>

    <section id="preview-region">
      <h2>プレビュー</h2>
      <div id="preview-content">通知プレビューは利用できます。</div>
      <p id="preview-error" role="alert"></p>
      <button id="retry-preview" type="button" hidden>プレビューだけ再試行</button>
      <button id="fail-preview" type="button">検証用: 描画失敗</button>
    </section>

    <section>
      <h2>基礎障害</h2>
      <button id="block-foundation" type="button">検証用: 権限エラー</button>
    </section>
  </div>
</main>
<script type="module" src="./fixture.mjs"></script>
</body>
</html>
