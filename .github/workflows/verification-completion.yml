name: Validate verification completion

on:
  pull_request:

permissions:
  contents: read

jobs:
  verification-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run runtime measurement and provider boundary tests
        run: node --test scripts/test-verification-reuse-measurement-core.mjs
      - name: Run paired measurement and handoff integration tests
        run: node --test scripts/test-verification-reuse-measurement.mjs
      - name: Measure public fixture without model credentials
        run: |
          node scripts/verification-reuse-measurement.mjs --provider fixture --repetitions 2 --output "$RUNNER_TEMP/verification-reuse-measurement" > /dev/null
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/verification-reuse-measurement/result.json")); console.log(JSON.stringify({head:process.env.GITHUB_SHA,baseline:r.baseline,reuse:r.reuse,delta:r.delta,complete:r.complete,issue_decision:r.issue_decision}));'
      - name: Retain bounded measurement JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reuse-measurement
          path: ${{ runner.temp }}/verification-reuse-measurement/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run decision-point protocol and accounting tests
        run: node --test scripts/test-verification-decision-core.mjs
      - name: Run real-Git multirevision and completion tests
        run: node --test scripts/test-verification-reuse-completion.mjs
      - name: Preserve exact and scoped evidence compatibility
        run: |
          node scripts/test-verification-evidence.mjs
          node scripts/test-verification-scoped-reuse.mjs
      - name: Check whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
