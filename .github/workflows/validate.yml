name: Validate repository

on:
  pull_request:
  workflow_dispatch:

jobs:
  independent-local-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify independent local clone objects across runner devices
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, lstatSync, mkdtempSync, readdirSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const parent = mkdtempSync(join(tmpdir(), 'ask-ci-local-clone-diagnostic-'));
          try {
            const repository = join(parent, 'repository');
            const result = spawnSync('git', ['clone', '--local', '--no-hardlinks', process.cwd(), repository], { encoding: 'utf8' });
            console.log(JSON.stringify({ status: result.status, signal: result.signal, stdout: result.stdout, stderr: result.stderr, error: result.error?.message }));
            assert.equal(result.status, 0, result.stderr);
            const revision = cwd => spawnSync('git', ['rev-parse', 'HEAD'], { cwd, encoding: 'utf8' });
            const sourceHead = revision(process.cwd()), copiedHead = revision(repository);
            assert.equal(sourceHead.status, 0, sourceHead.stderr);
            assert.equal(copiedHead.status, 0, copiedHead.stderr);
            assert.equal(copiedHead.stdout, sourceHead.stdout);
            const objects = join(repository, '.git/objects');
            assert.equal(existsSync(join(objects, 'info/alternates')), false);
            let objectFiles = 0;
            function inspect(directory) {
              for (const entry of readdirSync(directory, { withFileTypes: true })) {
                const path = join(directory, entry.name);
                if (entry.isDirectory()) inspect(path);
                else { const status = lstatSync(path); assert.ok(status.isFile()); assert.equal(status.nlink, 1); objectFiles++; }
              }
            }
            inspect(objects);
            assert.ok(objectFiles > 0);
            console.log(JSON.stringify({ independent_object_files: objectFiles, same_head: true, alternates: false }));
          } finally {
            rmSync(parent, { recursive: true, force: true });
          }
          NODE
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Exercise exact apply and no-write boundaries before long fixture suites.
      - name: Check whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check
          fi

      - name: Run ASK setup planning and exact apply tests
        run: node scripts/test-ask-setup.mjs

      - name: Run model-free install and recovery release smoke
        run: node scripts/test-release-install-recovery.mjs

      - name: Run public first-workflow preparation regressions
        run: node --test scripts/test-first-workflow-preparation.mjs

      - name: Run offline pragmatic evaluation report regressions
        run: node --test scripts/test-ask-pragmatic-evaluation-report.mjs

      - name: Verify explicit primary scoring-version connection (model-free)
        run: |
          node --test scripts/test-ask-primary-scoring-version.mjs scripts/test-ask-primary-processing-source.mjs scripts/test-ask-primary-resource-authority-writers.mjs scripts/test-ask-primary-runner-async-local-storage.mjs scripts/test-ask-primary-evaluation-private-grading.mjs scripts/test-ask-primary-evaluation-grading.mjs scripts/test-ask-benchmark-frozen-authority-modes.mjs
          node --experimental-test-module-mocks --test scripts/test-ask-primary-saved-scoring.mjs

      - name: Qualify prospective rule-batch contract and frozen preparation (model-free)
        run: node --test scripts/test-rule-batch-contract-v2.mjs scripts/test-rule-batch-comparison-preparation.mjs

      - name: Run UI harness and Skill-reference regressions
        run: |
          node --test scripts/test-codex-skill-reference-preflight.mjs scripts/test-skill-assets.mjs scripts/test-skill-reference-canonical.mjs scripts/test-ui-ux-adapter-assets.mjs docs/fixtures/ui-ux-design/fixture-state.test.mjs scripts/test-prompt-v2-historical-renderer.mjs

      - name: Run dependency-free scenario visual review regressions
        run: node --test scripts/test-scenario-visual-review.mjs

      # Fail before expensive suites, retaining the generator's exact-byte check.
      - name: Check adapter runtime bundle freshness
        run: |
          if node scripts/adapter-runtime-bundle.mjs --check; then
            exit 0
          fi
          # Diagnostic output is public generated metadata, never a source update.
          node scripts/adapter-runtime-bundle.mjs > "$RUNNER_TEMP/ask-expected-runtime-bundle.json"
          diff -u docs/fixtures/adapter-runtime-bundle.json "$RUNNER_TEMP/ask-expected-runtime-bundle.json"
          exit 1

      - name: Verify bounded full-target streaming snapshots (artificial only)
        run: node --test scripts/test-target-snapshot-streaming.mjs

      - name: Rehearse parent rollback and return to pre-install absence (artificial only)
        run: node --test scripts/test-personal-prompt-preinstall-return.mjs

      - name: Run synthetic JSON pilot fake-only regressions
        run: node --test scripts/test-ask-synthetic-json-pilot.mjs

      # Catch bounded aggregate regressions before the long repository suites.
      - name: Run portfolio aggregate v2 component sensitivity tests
        run: node scripts/test-ask-benchmark-portfolio-aggregate-result-v2.mjs

      - name: Run portfolio consumer sensitivity detail tests
        run: node scripts/test-ask-benchmark-portfolio-consumer-report.mjs

      - name: Run nondegenerate high-impact sensitivity and exact Evolution tests
        run: |
          node --version
          node scripts/test-ask-benchmark-portfolio-high-impact-sensitivity.mjs
          node scripts/test-evolution-loop-integration.mjs --high-impact-population

      - name: Run successor snapshot and source-session regressions (current HEAD)
        run: |
          # The real source-drift regression below needs PFci's exact public base.
          git fetch --no-tags origin a06e96f8a493b0ae70d3910c73c644b0da13fa25
          node --test scripts/test-ask-benchmark-source-session.mjs scripts/test-successor-process-state.test.mjs scripts/test-frozen-evaluator-fixture.test.mjs
          node --test scripts/test-ask-benchmark-calibration-source.mjs scripts/test-ask-benchmark-prompt-successor.mjs scripts/test-ask-benchmark-prompt-successor-delivery.mjs scripts/test-ask-benchmark-prompt-successor-native.mjs scripts/test-ask-benchmark-prompt-successor-report.mjs scripts/test-ask-benchmark-prompt-successor-scoring-inputs.mjs
          node --test scripts/test-ask-benchmark-prompt-successor-integration.mjs scripts/test-ask-benchmark-successor-input-snapshot.mjs scripts/test-ask-benchmark-evaluator-root-manifest.mjs

      - name: Run bounded successor scoring authority regressions (current HEAD)
        run: |
          node --test scripts/test-ask-benchmark-prompt-successor-input-guards.mjs
          node --test scripts/test-ask-benchmark-prompt-successor-scoring-contract.mjs

      # Exercise checkpoint boundaries before the expensive repository suite.
      - name: Run session checkpoint and resume tests
        run: node scripts/test-session-checkpoint.mjs

      # Reject generated-report drift before running the expensive suites.
      - name: Validate repository consistency
        id: repository_consistency
        run: node scripts/validate-repo.mjs

      - name: Show generated validation report diff on failure
        if: ${{ failure() && steps.repository_consistency.outcome == 'failure' }}
        run: |
          # Diagnostics only: retain the failed gate and never commit generated output.
          node scripts/validate-repo.mjs --write-report
          git diff -- docs/validation-report.md
          exit 1

      - name: Run repository validation tests
        run: node scripts/test-validate-repo.mjs

      - name: Run baseline semantic review route contract tests
        run: node scripts/test-review-route.mjs

      - name: Run Execution Envelope record contract tests
        run: node scripts/test-execution-envelope-record.mjs

      - name: Run installed Codex runner Execution Envelope conformance tests
        run: node scripts/test-codex-runner-execution-envelope-conformance.mjs

      - name: Run managed JSON Schema validation tests
        run: node scripts/test-json-schema-validation.mjs

      - name: Run exact Codex risk approval tests
        run: node scripts/test-codex-risk-approval.mjs

      - name: Run review decision matrix tests
        run: node scripts/test-review-decision-matrix.mjs

      - name: Run claim evidence status contract tests
        run: node scripts/test-claim-evidence-status.mjs

      - name: Run one-task Skill effectiveness outcome contract tests
        run: node scripts/test-skill-effectiveness-outcome.mjs

      - name: Run verification proof policy contract tests
        run: node scripts/test-verification-proof-policy.mjs

      - name: Run autonomous development control tests
        run: node scripts/test-ask-autonomous-development.mjs

      - name: Run epic admission and Work Package Plan contract tests
        run: node scripts/test-epic-admission-work-package-plan.mjs

      - name: Run generic content-addressed store tests
        run: node scripts/test-content-addressed-store.mjs

      - name: Run Asset Registry contract tests
        run: node scripts/test-asset-registry.mjs

      - name: Check the exact candidate-only Asset Registry sample
        run: node scripts/asset-registry-samples.mjs --check

      - name: Run evidence-conditioned Portfolio Manager contract tests
        run: |
          node scripts/test-portfolio-manager.mjs
          node --test scripts/test-portfolio-subscription-policy.mjs

      - name: Check the exact Portfolio Manager sample
        run: node scripts/portfolio-manager-samples.mjs --check

      - name: Run governed Evolution contract tests
        run: node scripts/test-evolution-loop.mjs

      - name: Run governed Evolution full-closure integration tests
        run: node scripts/test-evolution-loop-integration.mjs

      - name: Run personal observation and generated candidate contracts (model-free)
        run: node --test scripts/test-ask-personal-evolution-observation.mjs scripts/test-ask-personal-evolution.mjs scripts/test-ask-personal-evolution-generation.mjs scripts/test-ask-personal-evolution-generation-connector.mjs scripts/test-ask-personal-evolution-saved-results-mode.mjs scripts/test-ask-personal-evolution-primary-pair.mjs scripts/test-ask-personal-source-install.mjs scripts/test-ask-personal-prompt-runtime-v2.mjs scripts/test-personal-prompt-target-application.mjs scripts/test-personal-prompt-codex-handover.mjs scripts/test-personal-prompt-owner-manual-recovery.mjs scripts/test-codex-installer-preflight-order.mjs

      - name: Verify personal CLI and unstarted preparation recovery (model-free)
        run: node --experimental-test-module-mocks --test scripts/test-ask-personal-evolution-cli.mjs scripts/test-ask-personal-evolution-cli-catalog24.mjs scripts/test-ask-personal-evolution-cli-catalog24-v8.mjs scripts/test-ask-personal-evolution-cli-recovery.mjs scripts/test-ask-personal-evolution-unattended-policy.mjs scripts/test-ask-personal-evolution-unattended.mjs scripts/test-ask-personal-evolution-rejection.mjs

      - name: Verify real personal source reviewer contract (fake transport only)
        run: node --test scripts/test-ask-personal-evolution-source-reviewer.mjs

      - name: Check the exact governed Evolution sample
        run: node scripts/evolution-loop-samples.mjs --check

      - name: Run portfolio catalog tests
        run: node scripts/test-ask-benchmark-portfolio-catalog.mjs

      - name: Run portfolio policy tests
        run: node scripts/test-ask-benchmark-portfolio-policy.mjs

      - name: Run prospective task evidence partial readout tests (model-free)
        run: |
          node --test scripts/test-ask-task-evidence-profile.mjs
          node scripts/test-ask-benchmark-portfolio-result-set.mjs --task-evidence-readout-only

      - name: Run portfolio design pre-admission tests
        run: node scripts/test-ask-benchmark-design-admission.mjs

      - name: Run portfolio independent design review tests
        run: node scripts/test-ask-benchmark-design-review.mjs

      - name: Run portfolio admission decision overlay tests
        run: node scripts/test-ask-benchmark-admission-decision.mjs

      - name: Fetch public reviewed heads for admitted fixture invariance
        run: |
          git fetch --no-tags origin e51eeddf5e5675660205e7f70bcdba202b57e77c
          git fetch --no-tags origin 277d5d7bca619bb7dca17190aa4f9f99bfbbe23a

      - name: Guard admitted fixture invariance
        run: node scripts/test-ask-benchmark-admitted-fixture-invariance.mjs

      - name: Run general benchmark tests
        run: node scripts/test-ask-benchmark.mjs

      - name: Run adaptive portfolio execution tests
        run: node scripts/test-ask-benchmark-execution.mjs

      - name: Run admitted portfolio propagation preparation tests
        run: node scripts/test-ask-benchmark-admission-propagation.mjs

      - name: Run verification command evidence contract tests
        run: node scripts/test-ask-benchmark-command-evidence.mjs

      - name: Verify read-only saved primary command capture
        run: node --test scripts/test-ask-primary-saved-command-capture.mjs

      - name: Verify prospective primary evidence and public review recognition (artificial inputs only)
        run: |
          node scripts/generate-ask-primary-grading-schemas.mjs --command-evidence-v2 --check
          node scripts/generate-ask-primary-grading-schemas.mjs --command-evidence-v3 --check
          node scripts/generate-ask-primary-grading-schemas.mjs --command-evidence-v4 --check
          node scripts/generate-ask-primary-grading-schemas.mjs --command-evidence-v5 --check
          node scripts/generate-ask-primary-grading-schemas.mjs --command-evidence-v6 --check
          node scripts/generate-ask-primary-grading-schemas.mjs --evaluation-v7 --check
          node scripts/generate-ask-primary-grading-schemas.mjs --evaluation-v8 --check
          node --experimental-test-module-mocks --test scripts/test-ask-primary-unsafe-actions-v8.mjs scripts/test-ask-primary-v8-resource-closure.mjs
          node --test scripts/test-ask-primary-classification-v7.mjs scripts/test-ask-primary-runtime-shell-v7.mjs scripts/test-ask-primary-evaluation-correctness-v7.mjs
          node --experimental-test-module-mocks --test scripts/test-ask-primary-registered-fixture-v7.mjs
          node --experimental-test-module-mocks --test scripts/test-ask-primary-authority-v2.mjs scripts/test-ask-primary-build-successor-v2.mjs scripts/test-ask-review-archive-v2-scope.mjs
          node --test scripts/test-ask-primary-command-evidence-v3.mjs
          node --test scripts/test-ask-primary-command-evidence-v4.mjs
          node --test scripts/test-ask-primary-command-literal-word-v5.mjs
          node --test scripts/test-ask-primary-auxiliary-shell-v6.mjs
          node --test scripts/test-ask-primary-evidence-recognition-v2.mjs scripts/test-ask-review-target-requirement-v2.mjs

      - name: Verify literal body and review target diagnostics (no execution)
        run: node --test scripts/test-ask-saved-command-body-observation.mjs scripts/test-ask-review-target-requirement.mjs

      - name: Verify bounded private runtime observation transport
        run: node --test scripts/test-ask-benchmark-runtime-observation.mjs

      - name: Run verification evidence exact-reuse tests
        run: node scripts/test-verification-evidence.mjs

      - name: Run verification scoped reuse and coverage tests
        run: node scripts/test-verification-scoped-reuse.mjs

      - name: Run adaptive portfolio normalized result tests
        run: node scripts/test-ask-benchmark-normalized-results.mjs

      - name: Run terminal inventory protocol ordering regressions
        run: node --test scripts/test-ask-benchmark-terminal-inventory-order.mjs

      - name: Run evaluator isolation boundary tests
        run: node scripts/test-ask-benchmark-evaluator-boundary.mjs

      - name: Run build-option fixture contract tests
        run: node scripts/test-ask-benchmark-mn-build-option-update.mjs

      - name: Run schema-field public source tests (current HEAD)
        run: node --test scripts/test-ask-benchmark-mn-schema-field-source.mjs

      - name: Run frontend-default public source tests (current HEAD)
        run: node --test scripts/test-ask-benchmark-mn-frontend-default-source.mjs

      - name: Run practice-frequency public source tests (current HEAD)
        run: node --test scripts/test-ask-benchmark-pf-api-pagination-source.mjs scripts/test-ask-benchmark-pf-frontend-async-source.mjs scripts/test-ask-benchmark-pf-ci-cache-source.mjs

      - name: Run practice-frequency fixture source-freeze tests
        run: |
          # Exact declared evaluator sources; no current-runtime/admission claim.
          git fetch --no-tags origin a762daf43bdfe254c6ecd6e0b49f3cef78d0e9ec
          git fetch --no-tags origin 88359c4b4d12210180063e9bfb5d08b7edad90f3
          node --test scripts/test-ask-benchmark-prepare-capability.mjs
          node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-pf-api-pagination.mjs
          node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-pf-frontend-async.mjs
          node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-pf-ci-cache.mjs

      # Frozen fixture contracts run against their declared source closure, not
      # the evolving runner. Current-HEAD runtime/scorer gates remain above/below.
      - name: Run schema-field fixture source-freeze tests
        run: |
          # The fixture pins the public pre-squash source, outside main ancestry.
          git fetch --no-tags origin 2c498d974681f8b5092759386f39abd7601e4fb4
          node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mn-schema-field-alignment.mjs

