  repository-tests:
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.ci_receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Run repository validation tests
        id: ci_29e2de4dbe38
        run: node scripts/test-validate-repo.mjs

      - name: Record required step completion
        id: ci_receipt
        env:
          CI_RECEIPT_JOB: repository-tests
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci-execution-plan.mjs receipt

  personal-cli:
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.ci_receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Verify personal CLI and unstarted preparation recovery (model-free)
        id: ci_b23f8d7dc12d
        run: node --experimental-test-module-mocks --test scripts/test-ask-personal-evolution-cli.mjs scripts/test-ask-personal-evolution-cli-catalog24.mjs scripts/test-ask-personal-evolution-cli-catalog24-v8.mjs scripts/test-ask-personal-evolution-cli-recovery.mjs scripts/test-ask-personal-evolution-unattended-policy.mjs scripts/test-ask-personal-evolution-unattended.mjs scripts/test-ask-personal-evolution-rejection.mjs

      - name: Record required step completion
        id: ci_receipt
        env:
          CI_RECEIPT_JOB: personal-cli
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci-execution-plan.mjs receipt

  validate:
    if: ${{ always() }}
    needs: [plan, independent-local-clone, docs-checks, common, repository-tests, personal-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Require full execution and bound completion evidence
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-execution-plan.mjs gate
