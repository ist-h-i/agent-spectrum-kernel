name: Validate repository

on:
  pull_request:
  workflow_dispatch:

jobs:
  plan:
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Record strict full-execution shadow plan
        id: plan
        run: node scripts/ci-execution-plan.mjs plan

  independent-local-clone:
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.ci_receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Verify independent local clone objects across runner devices
        id: ci_8f05758e0028
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, lstatSync, mkdtempSync, readdirSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const parent = mkdtempSync(join(tmpdir(), 'ask-ci-local-clone-diagnostic-'));
          try {
            const repository = join(parent, 'repository');
            const result = spawnSync('git', ['clone', '--local', '--no-hardlinks', process.cwd(), repository], { encoding: 'utf8' });
            console.log(JSON.stringify({ status: result.status, signal: result.signal, stdout: result.stdout, stderr: result.stderr, error: result.error?.message }));
            assert.equal(result.status, 0, result.stderr);
            const revision = cwd => spawnSync('git', ['rev-parse', 'HEAD'], { cwd, encoding: 'utf8' });
            const sourceHead = revision(process.cwd()), copiedHead = revision(repository);
            assert.equal(sourceHead.status, 0, sourceHead.stderr);
            assert.equal(copiedHead.status, 0, copiedHead.stderr);
            assert.equal(copiedHead.stdout, sourceHead.stdout);
            const objects = join(repository, '.git/objects');
            assert.equal(existsSync(join(objects, 'info/alternates')), false);
            let objectFiles = 0;
            function inspect(directory) {
              for (const entry of readdirSync(directory, { withFileTypes: true })) {
                const path = join(directory, entry.name);
                if (entry.isDirectory()) inspect(path);
                else { const status = lstatSync(path); assert.ok(status.isFile()); assert.equal(status.nlink, 1); objectFiles++; }
              }
            }
            inspect(objects);
            assert.ok(objectFiles > 0);
            console.log(JSON.stringify({ independent_object_files: objectFiles, same_head: true, alternates: false }));
          } finally {
            rmSync(parent, { recursive: true, force: true });
          }
          NODE

      - name: Record required step completion
        id: ci_receipt
        env:
          CI_RECEIPT_JOB: independent-local-clone
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci-execution-plan.mjs receipt

  docs-checks:
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.ci_receipt.outputs.receipt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"

      - name: Verify CI coverage preservation and strict aggregate
        id: ci_ff7b72596cb1
        run: node --test scripts/test-ci-full-run.mjs

      - name: Verify conservative change classification (shadow only)
        id: ci_889971cec7d7
        run: node --test scripts/test-ci-change-shadow.mjs

      - name: Record proposed change classification (all verification still runs)
        id: ci_bc9c194b2ff7
        run: node scripts/ci-change-shadow.mjs

      - name: Run autonomous development control tests
        id: ci_10b10140dde0
        run: node scripts/test-ask-autonomous-development.mjs

      # Exercise exact apply and no-write boundaries before long fixture suites.
      - name: Check whitespace errors
        id: ci_8ed91715b74a
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check
          fi

      - name: Validate repository consistency
        id: repository_consistency
        run: node scripts/validate-repo.mjs

      - name: Show generated validation report diff on failure
        id: ci_0d0bb20d25f0
        if: ${{ failure() && steps.repository_consistency.outcome == 'failure' }}
        run: |
          # Diagnostics only: retain the failed gate and never commit generated output.
          node scripts/validate-repo.mjs --write-report
          git diff -- docs/validation-report.md
          exit 1

      - name: Verify strict shadow plan and execution receipts
        id: ci_37a2daccda76
        run: node --test scripts/test-ci-execution-plan.mjs

      - name: Record required step completion
        id: ci_receipt
        env:
          CI_RECEIPT_JOB: docs-checks
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci-execution-plan.mjs receipt

