name: Validate repository

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Fail before expensive suites, retaining the generator's exact-byte check.
      - name: Check adapter runtime bundle freshness
        run: |
          if node scripts/adapter-runtime-bundle.mjs --check; then
            exit 0
          fi
          # Diagnostic output is public generated metadata, never a source update.
          node scripts/adapter-runtime-bundle.mjs > "$RUNNER_TEMP/ask-expected-runtime-bundle.json"
          diff -u docs/fixtures/adapter-runtime-bundle.json "$RUNNER_TEMP/ask-expected-runtime-bundle.json"
          exit 1

      # Catch bounded aggregate regressions before the long repository suites.
      - name: Run portfolio aggregate v2 component sensitivity tests
        run: node scripts/test-ask-benchmark-portfolio-aggregate-result-v2.mjs

      - name: Run portfolio consumer sensitivity detail tests
        run: node scripts/test-ask-benchmark-portfolio-consumer-report.mjs

      - name: Run successor snapshot and source-session regressions (current HEAD)
        run: |
          node --test scripts/test-ask-benchmark-source-session.mjs scripts/test-successor-process-state.test.mjs scripts/test-frozen-evaluator-fixture.test.mjs
          node --test scripts/test-ask-benchmark-calibration-source.mjs scripts/test-ask-benchmark-prompt-successor.mjs scripts/test-ask-benchmark-prompt-successor-delivery.mjs scripts/test-ask-benchmark-prompt-successor-native.mjs scripts/test-ask-benchmark-prompt-successor-report.mjs scripts/test-ask-benchmark-prompt-successor-scoring-inputs.mjs
          node --test scripts/test-ask-benchmark-prompt-successor-integration.mjs scripts/test-ask-benchmark-successor-input-snapshot.mjs scripts/test-ask-benchmark-evaluator-root-manifest.mjs

      - name: Run bounded successor scoring authority regressions (current HEAD)
        run: |
          node --test scripts/test-ask-benchmark-prompt-successor-input-guards.mjs
          node --test scripts/test-ask-benchmark-prompt-successor-scoring-contract.mjs

      # Exercise checkpoint boundaries before the expensive repository suite.
      - name: Run session checkpoint and resume tests
        run: node scripts/test-session-checkpoint.mjs

      # Reject generated-report drift before running the expensive suites.
      - name: Validate repository consistency
        id: repository_consistency
        run: node scripts/validate-repo.mjs

      - name: Show generated validation report diff on failure
        if: ${{ failure() && steps.repository_consistency.outcome == 'failure' }}
        run: |
          # Diagnostics only: retain the failed gate and never commit generated output.
          node scripts/validate-repo.mjs --write-report
          git diff -- docs/validation-report.md
          exit 1

      - name: Run repository validation tests
        run: node scripts/test-validate-repo.mjs

      - name: Run read-only ASK setup planning tests
        run: node scripts/test-ask-setup.mjs

      - name: Run baseline semantic review route contract tests
        run: node scripts/test-review-route.mjs

      - name: Run Execution Envelope record contract tests
        run: node scripts/test-execution-envelope-record.mjs

      - name: Run installed Codex runner Execution Envelope conformance tests
        run: node scripts/test-codex-runner-execution-envelope-conformance.mjs

      - name: Run managed JSON Schema validation tests
        run: node scripts/test-json-schema-validation.mjs

      - name: Run exact Codex risk approval tests
        run: node scripts/test-codex-risk-approval.mjs

      - name: Run review decision matrix tests
        run: node scripts/test-review-decision-matrix.mjs

      - name: Run claim evidence status contract tests
        run: node scripts/test-claim-evidence-status.mjs

      - name: Run one-task Skill effectiveness outcome contract tests
        run: node scripts/test-skill-effectiveness-outcome.mjs

      - name: Run verification proof policy contract tests
        run: node scripts/test-verification-proof-policy.mjs

      - name: Run autonomous development control tests
        run: node scripts/test-ask-autonomous-development.mjs

      - name: Run epic admission and Work Package Plan contract tests
        run: node scripts/test-epic-admission-work-package-plan.mjs

      - name: Run generic content-addressed store tests
        run: node scripts/test-content-addressed-store.mjs

      - name: Run Asset Registry contract tests
        run: node scripts/test-asset-registry.mjs

      - name: Check the exact candidate-only Asset Registry sample
        run: node scripts/asset-registry-samples.mjs --check

      - name: Run evidence-conditioned Portfolio Manager contract tests
        run: node scripts/test-portfolio-manager.mjs

      - name: Check the exact Portfolio Manager sample
        run: node scripts/portfolio-manager-samples.mjs --check

      - name: Run governed Evolution contract tests
        run: node scripts/test-evolution-loop.mjs

      - name: Run governed Evolution full-closure integration tests
        run: node scripts/test-evolution-loop-integration.mjs

      - name: Check the exact governed Evolution sample
        run: node scripts/evolution-loop-samples.mjs --check

      - name: Run portfolio catalog tests
        run: node scripts/test-ask-benchmark-portfolio-catalog.mjs

      - name: Run portfolio policy tests
        run: node scripts/test-ask-benchmark-portfolio-policy.mjs

      - name: Run portfolio design pre-admission tests
        run: node scripts/test-ask-benchmark-design-admission.mjs

      - name: Run portfolio independent design review tests
        run: node scripts/test-ask-benchmark-design-review.mjs

      - name: Run portfolio admission decision overlay tests
        run: node scripts/test-ask-benchmark-admission-decision.mjs

      - name: Guard admitted fixture invariance
        run: node scripts/test-ask-benchmark-admitted-fixture-invariance.mjs

      - name: Run general benchmark tests
        run: node scripts/test-ask-benchmark.mjs

      - name: Run adaptive portfolio execution tests
        run: node scripts/test-ask-benchmark-execution.mjs

      - name: Run verification command evidence contract tests
        run: node scripts/test-ask-benchmark-command-evidence.mjs

      - name: Run verification evidence exact-reuse tests
        run: node scripts/test-verification-evidence.mjs

      - name: Run verification scoped reuse and coverage tests
        run: node scripts/test-verification-scoped-reuse.mjs

      - name: Run adaptive portfolio normalized result tests
        run: node scripts/test-ask-benchmark-normalized-results.mjs

      - name: Run evaluator isolation boundary tests
        run: node scripts/test-ask-benchmark-evaluator-boundary.mjs

      - name: Run build-option fixture contract tests
        run: node scripts/test-ask-benchmark-mn-build-option-update.mjs

      # Frozen fixture contracts run against their declared source closure, not
      # the evolving runner. Current-HEAD runtime/scorer gates remain above/below.
      - name: Run documentation/config fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mn-doc-config-correction.mjs

      - name: Run focused regression fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mn-focused-regression-test.mjs

      - name: Run CI-evidence review fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-ci-evidence-gap.mjs

      - name: Run accessibility interaction review fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-accessibility-interaction-review.mjs

      - name: Run data migration handoff fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-data-migration-handoff.mjs

      - name: Run frontend state review fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-frontend-state-review.mjs

      - name: Run IaC rollback design fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-iac-rollback-design.mjs

      - name: Run performance investigation fixture source-freeze tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-performance-investigation.mjs

      - name: Run CI-evidence review archive contract tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-ci-evidence-gap-review-archive.mjs

      - name: Run accessibility interaction review archive contract tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-accessibility-interaction-review-review-archive.mjs

      - name: Run data migration handoff review archive contract tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-data-migration-handoff-review-archive.mjs

      - name: Run frontend state review archive contract tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-frontend-state-review-archive.mjs

      - name: Run IaC rollback design review archive contract tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-iac-rollback-design-review-archive.mjs

      - name: Run performance investigation review archive contract tests
        run: node scripts/test-frozen-evaluator-fixture.mjs test-ask-benchmark-mp-performance-investigation-review-archive.mjs

      - name: Run evaluator-authority integration contract tests
        run: node scripts/test-ask-benchmark-portfolio-evaluator-result.mjs

      - name: Run portfolio raw engineering result score tests
        run: node scripts/test-ask-benchmark-portfolio-score.mjs

      - name: Run portfolio engineering result-set tests
        run: node scripts/test-ask-benchmark-portfolio-result-set.mjs

      - name: Run portfolio repetition report tests
        run: node scripts/test-ask-benchmark-portfolio-repetition-report.mjs

      - name: Run portfolio paired comparison report tests
        run: node scripts/test-ask-benchmark-portfolio-paired-comparison-report.mjs

      - name: Run portfolio aggregate result tests
        run: node scripts/test-ask-benchmark-portfolio-aggregate-result.mjs

      - name: Run portfolio directional outcome report tests
        run: node scripts/test-ask-benchmark-portfolio-directional-outcome-report.mjs

      - name: Run portfolio mechanism observation scorecard tests
        run: node scripts/test-ask-benchmark-portfolio-mechanism-scorecard.mjs

      - name: Run legacy calibration migration tests
        run: node scripts/test-ask-benchmark-portfolio-legacy-calibration-migration.mjs

      - name: Run Prompt v2 preregistration contract tests
        run: node scripts/test-ask-benchmark-prompt-v2.mjs

      - name: Run Prompt v2 preregistration authority fixture tests
        run: node scripts/test-prompt-v2-preregistration-samples.mjs

      - name: Check Prompt v2 preregistration authority fixture freshness
        run: node scripts/prompt-v2-preregistration-samples.mjs --check

      - name: Check whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check
          fi
