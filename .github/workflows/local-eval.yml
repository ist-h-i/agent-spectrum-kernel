name: Local eval fake routes
on:
  pull_request:
  workflow_dispatch:
jobs:
  fake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Observe host prerequisites without Codex or auth
        run: node scripts/ask-local-eval.mjs preflight
      # Ubuntu coverage is owned by Validate repository, with identical Node/OS/flags.
      - name: Primary authority profile and static resource boundaries (no workers)
        if: matrix.os == 'macos-15'
        run: node --experimental-test-module-mocks --test scripts/test-ask-primary-authority-v2.mjs scripts/test-ask-review-archive-v2-scope.mjs scripts/test-ask-primary-unsafe-actions-v8.mjs
      - name: Nine-primary-fixture personal roundtrip (fake provider/runner/grading only)
        run: node --experimental-test-module-mocks --test scripts/test-ask-personal-evolution-primary-loop.mjs
      # Ubuntu coverage is owned by Validate repository, with identical Node/OS/flags.
      - name: Personal user command loop and resume (fake dispatch only)
        if: matrix.os == 'macos-15'
        run: node --experimental-test-module-mocks --test scripts/test-ask-personal-evolution-cli.mjs scripts/test-ask-personal-evolution-cli-catalog24.mjs scripts/test-ask-personal-evolution-cli-catalog24-v8.mjs scripts/test-ask-personal-evolution-unattended.mjs
      - name: Personal candidate generation adapter (fake transport only)
        run: node --test scripts/test-ask-personal-evolution-codex-generation.mjs
      # Ubuntu coverage is owned by Validate repository, with identical Node/OS/flags.
      - name: Personal source reviewer adapter (fake transport only)
        if: matrix.os == 'macos-15'
        run: node --test scripts/test-ask-personal-evolution-source-reviewer.mjs
      - name: Fake lifecycle and failure regressions (no model calls)
        run: node --test scripts/test-ask-local-eval.mjs scripts/test-ask-local-codex.mjs scripts/test-ask-local-codex-time-budget.mjs
      # Ordinary Node process-group and inode boundaries also require Mac coverage.
      - name: Prospective performance condition lifetime (artificial Node processes only)
        if: matrix.os == 'macos-15'
        run: node --test scripts/test-ask-primary-performance-execution.mjs scripts/test-ask-primary-performance-lifetime.mjs
      - name: Synthetic JSON pilot (Ubuntu covered by Validate repository)
        if: matrix.os == 'macos-15'
        run: node --test scripts/test-ask-synthetic-json-pilot.mjs
      - name: User repository comparison preparation and execution (fake runner only)
        run: node --test scripts/test-ask-user-comparison-prepare.mjs scripts/test-ask-user-comparison.mjs scripts/test-ask-user-comparison-logs.mjs scripts/test-ask-user-comparison-unattended.mjs scripts/test-codex-output-observer.mjs
      # Pure render/condition checks; Mac OS boundaries are covered by the real
      # process/path/permission suites above and below (see CI OS inventory).
      - name: Kernel principles common logic (Ubuntu owner)
        if: matrix.os == 'ubuntu-24.04'
        run: node --test scripts/test-kernel-principles.mjs
      - name: Single-shot lifecycle regressions (entirely fake I/O)
        run: node --test scripts/test-ask-user-comparison-single-shot.mjs
      - name: Historical context isolation boundaries (current HEAD)
        run: node --test scripts/test-historical-full-test-root.mjs
      # Immutable Full/Core products are historical compatibility checks.
      # Current-HEAD UI distribution stays in Validate repository.
      - name: Prepare isolated immutable Full test context
        id: historical
        run: |
          node scripts/prepare-historical-full-test-root.mjs "$RUNNER_TEMP/ask-historical-full" > "$RUNNER_TEMP/ask-historical-path"
          echo "root=$(cat "$RUNNER_TEMP/ask-historical-path")" >> "$GITHUB_OUTPUT"
      - name: Full reference closure and three-arm synthetic protocol (no Codex)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-local-full-package.mjs scripts/test-ask-local-three-arm.mjs scripts/test-ask-local-three-arm-qualification.mjs
      - name: Opt-in shared core, Full projections and offline comparison (no Codex)
        working-directory: ${{ steps.historical.outputs.root }}
        run: |
          node scripts/generate-ask-core-bundle.mjs --check
          node --test scripts/test-ask-core-bundle.mjs
      - name: Mac native adapter proposal and task prequalification (synthetic only)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-core-native-preparation.mjs
      - name: Fixed synthetic process receiver and protected offline results (no native CLI)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-core-native-receiver.mjs
      - name: Exact authority lifecycle, new-session adapter and scratch integration (synthetic only)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-core-native-boundaries.mjs scripts/test-ask-core-native-connection.mjs
      - name: Core condition grading authority and scored offline replay (synthetic only)
        working-directory: ${{ steps.historical.outputs.root }}
        run: |
          node scripts/generate-ask-core-grading-schemas.mjs --check
          node scripts/test-ask-benchmark-portfolio-score.mjs --core-grading-only
      - name: Native compatibility record bindings without controller trust (synthetic only)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-core-native-compatibility-provenance.mjs
      - name: Owner-attributed controller context boundaries (synthetic only)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-core-controller-attribution.mjs scripts/test-ask-core-evaluator-dependency-closure.mjs
      - name: Saved capture to original normalizer and terminal scoring inputs (synthetic only)
        working-directory: ${{ steps.historical.outputs.root }}
        run: node --test scripts/test-ask-core-capture-producer.mjs
