name: Ceiling public fixtures

on:
  pull_request:
    paths:
      - 'benchmarks/challenge-candidates/review-ceiling-v1/**'
      - 'benchmarks/challenge-candidates/ui-reconstruction-v1/**'
      - 'benchmarks/evaluation-tasks.json'
      - 'benchmarks/task-revisions/**'
      - 'benchmarks/portfolio-catalog.json'
      - 'benchmarks/fixtures/checkpoint-b2/**'
      - 'benchmarks/challenge-candidates/business-five-v3-decisions/**'
      - 'scripts/**'
      - '.github/workflows/ceiling-public-fixtures.yml'
  workflow_dispatch:

jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Check business decision public inputs
        run: node --test benchmarks/challenge-candidates/business-five-v3-decisions/tools/public-package.test.mjs

      - name: Select and prepare active evaluation tasks without model calls
        run: |
          node scripts/seal-evaluation-revisions.mjs
          node --test scripts/test-evaluation-task-catalog.mjs scripts/test-evaluation-task-inputs.mjs scripts/test-evaluation-task-scoring.mjs

      - name: Check registered review challenge and shared staged execution
        run: |
          node benchmarks/challenge-candidates/review-ceiling-v1/tools/manifest.mjs --check
          node benchmarks/challenge-candidates/review-ceiling-v1/tools/validate.mjs
          node --test benchmarks/challenge-candidates/review-ceiling-v1/workspace/packages/portal/test/*.test.mjs
          node --test scripts/test-challenge-evaluation.mjs

      - name: Check CH08 public UI task and semantic scoring contracts (model-free)
        run: |
          node benchmarks/challenge-candidates/ui-reconstruction-v1/tools/manifest.mjs
          node --test benchmarks/challenge-candidates/ui-reconstruction-v1/tools/public-package.test.mjs benchmarks/challenge-candidates/ui-reconstruction-v1/tools/score-v2.test.mjs
