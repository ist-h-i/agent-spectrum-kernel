name: Ceiling public fixtures

on:
  pull_request:
    paths:
      - 'benchmarks/challenge-candidates/ceiling-v1/**'
      - 'benchmarks/challenge-candidates/ceiling-v2-debt/**'
      - 'benchmarks/challenge-candidates/ceiling-v3-causal/**'
      - 'benchmarks/challenge-candidates/business-five-v1/**'
      - 'benchmarks/challenge-candidates/business-five-v2-workflows/**'
      - 'benchmarks/challenge-candidates/business-five-v3-decisions/**'
      - 'scripts/**'
      - '.github/workflows/ceiling-public-fixtures.yml'
  workflow_dispatch:

jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Check public input seals
        run: node benchmarks/challenge-candidates/ceiling-v1/tools/seal-public-inputs.mjs
      - name: Verify fresh workspaces, public tests and submission boundaries
        run: node --test benchmarks/challenge-candidates/ceiling-v1/tools/public-workspace.test.mjs benchmarks/challenge-candidates/ceiling-v1/tools/scenario-protocol.test.mjs benchmarks/challenge-candidates/ceiling-v1/tools/scenario-replay.test.mjs
      - name: Check versioned debt inputs and execution boundaries
        run: node --test benchmarks/challenge-candidates/ceiling-v2-debt/tools/public-workspace.test.mjs benchmarks/challenge-candidates/ceiling-v2-debt/tools/array-projection.test.mjs
      - name: Check causal version input seals and protocol boundaries
        run: node --test benchmarks/challenge-candidates/ceiling-v3-causal/tools/public-workspace.test.mjs benchmarks/challenge-candidates/ceiling-v3-causal/tools/array-projection.test.mjs

      - name: Check business task public delivery boundaries
        run: node --test benchmarks/challenge-candidates/business-five-v1/tools/public-package.test.mjs

      - name: Check integrated business workflow public inputs
        run: node --test benchmarks/challenge-candidates/business-five-v2-workflows/tools/public-package.test.mjs

      - name: Check business decision public inputs
        run: node --test benchmarks/challenge-candidates/business-five-v3-decisions/tools/public-package.test.mjs
