name: PR 294 review diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 294 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Construct exact selected-Skill evidence repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path('scripts/ask-benchmark-execution.mjs')
          tests = Path('scripts/test-ask-benchmark-execution.mjs')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'd834775b2ea6e404ff97db13fc91a8e60488abb6d8313f7b0293f6ac44db04ef'
          assert hashlib.sha256(tests.read_bytes()).hexdigest() == '1c6ea97d2b9138a28549ee5890e274f3824fdb4d6360426be8c2999c3768ec45'
          text = source.read_text()
          needle = '    selected_skills: plan.selectedSkills,'
          assert text.count(needle) == 1
          source.write_text(text.replace(needle, '    selected_skills: closure,'))
          text = tests.read_text()
          needle = '    const prefix = entry.adapter_track === "codex" ? ".agents/skills/ui-ux-design/" : ".claude/skills/ui-ux-design/";'
          assert text.count(needle) == 1
          added = '''    if (entry.condition === "adaptive_ask") {
                const owners = [...new Set(request.projection.inventory.map((asset) => asset.path.split("/")[2]))].sort();
                assert.deepEqual(request.projection.selected_skills, owners, "selected Skill entries must match projected owners, not reference-file count");
              }
          '''
          tests.write_text(text.replace(needle, added + needle))
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '7ec8b44dec278dac3c0a23dcb99922133d4c40b91476d3cf9f357e169b7c4685'
          assert hashlib.sha256(tests.read_bytes()).hexdigest() == '8a9fc83418fcf66ee87209bfe2daec27cbc55c5b6b6bbfa3251822544db5ec0e'
          PY
          git rm .github/workflows/pr294-review-diagnostics.yml
          git add scripts/ask-benchmark-execution.mjs scripts/test-ask-benchmark-execution.mjs
          git -c user.name='PR 294 candidate verification' -c user.email='candidate@localhost' commit -m 'local candidate: retain selected Skill identities'
          test "$(git rev-parse HEAD^{tree})" = 66c06ece11ca410769a82791ec7a0d9b39225933
      - name: Verify exact repair candidate
        run: |
          node scripts/test-ask-benchmark-execution.mjs
          node --test scripts/test-codex-skill-reference-preflight.mjs scripts/test-skill-assets.mjs scripts/test-skill-reference-canonical.mjs scripts/test-ui-ux-adapter-assets.mjs docs/fixtures/ui-ux-design/fixture-state.test.mjs scripts/test-prompt-v2-historical-renderer.mjs
          node scripts/adapter-runtime-bundle.mjs --check
          node scripts/validate-repo.mjs
          git diff --check HEAD^
      - name: Store verified blobs without changing branch references
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const expected = {
              'scripts/ask-benchmark-execution.mjs': '7dc44c9474a70a39d21489e6bdda18b147357dc8',
              'scripts/test-ask-benchmark-execution.mjs': '58213a66b61d38e16a3741e10790b0c440724b54'
            };
            for (const [path, sha] of Object.entries(expected)) {
              const bytes = fs.readFileSync(path);
              const actual = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              if (actual !== sha) throw new Error(`Unexpected candidate blob: ${path}`);
              const { data } = await github.rest.git.createBlob({ ...context.repo, content: bytes.toString('base64'), encoding: 'base64' });
              if (data.sha !== sha) throw new Error(`Published blob mismatch: ${path}`);
              core.info(`VERIFIED_BLOB ${path} ${data.sha}`);
            }
