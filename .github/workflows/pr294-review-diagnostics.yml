name: PR 294 review diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 294 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Construct exact bounded repair candidate
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          encoded = ''
          encoded = encoded.replace('GjsPsPsPx', 'GjsPsPx').replace('C9NPSG6+gc', 'C9NPSG6gc')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd467d9e0a54b63e6f03993fd99ca834737deb6e6c87169e17a2585b8458bc385'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm .github/workflows/pr294-review-diagnostics.yml
          git add scripts/ask-benchmark-execution.mjs scripts/test-ask-benchmark-execution.mjs
          git -c user.name='PR 294 candidate verification' -c user.email='candidate@localhost' commit -m 'local candidate: benchmark Skill reference repair'
          printf '%s  %s\n' d834775b2ea6e404ff97db13fc91a8e60488abb6d8313f7b0293f6ac44db04ef scripts/ask-benchmark-execution.mjs 1c6ea97d2b9138a28549ee5890e274f3824fdb4d6360426be8c2999c3768ec45 scripts/test-ask-benchmark-execution.mjs | sha256sum --check
      - name: Verify repaired execution and reference boundaries
        run: |
          node scripts/test-ask-benchmark-execution.mjs
          node --test scripts/test-codex-skill-reference-preflight.mjs scripts/test-skill-assets.mjs scripts/test-skill-reference-canonical.mjs scripts/test-ui-ux-adapter-assets.mjs docs/fixtures/ui-ux-design/fixture-state.test.mjs scripts/test-prompt-v2-historical-renderer.mjs
          node scripts/adapter-runtime-bundle.mjs --check
          node scripts/validate-repo.mjs
          git diff --check HEAD^
      - name: Store verified blobs without updating any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const expected = {
              'scripts/ask-benchmark-execution.mjs': 'c96fd11f409bb7cf1704c203726046474e680fe3',
              'scripts/test-ask-benchmark-execution.mjs': 'f7a67f1cec040384d64a0de7d2294947c1c18d21'
            };
            for (const [path, sha] of Object.entries(expected)) {
              const bytes = fs.readFileSync(path);
              const local = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              if (local !== sha) throw new Error(`Unexpected candidate blob: ${path}`);
              const { data } = await github.rest.git.createBlob({ ...context.repo, content: bytes.toString('base64'), encoding: 'base64' });
              if (data.sha !== sha) throw new Error(`Published blob mismatch: ${path}`);
              core.info(`VERIFIED_BLOB ${path} ${data.sha}`);
            }
