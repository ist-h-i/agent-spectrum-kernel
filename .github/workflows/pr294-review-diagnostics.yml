name: PR 294 review diagnostics

on:
  pull_request:

jobs:
  reference-regression:
    if: github.event.pull_request.number == 294 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/284-ui-ux-harness'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply bounded review candidate
        run: |
          echo 'fa4ddd0f6da82e1ecbeeb75690bf9d0d38bca36b4f07efc6e109367951861139  scripts/ask-shared.mjs' | sha256sum -c
          echo '9a5eb8c128c99a6201c00a8224083de8918dc3841d3d1100c8c97adf479c4c76  scripts/test-ui-ux-adapter-assets.mjs' | sha256sum -c
          echo 'e02520eb2d3cde3eaa7f6799139bbd0a7583ab0c5931bac65b171ae3de2af253  .github/workflows/validate.yml' | sha256sum -c
          git apply --check .github/pr294-review-repair.patch
          git apply .github/pr294-review-repair.patch
          node scripts/adapter-runtime-bundle.mjs --write-adapters
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { buildCodexProjectionPlan } from './scripts/install-codex-adapter.mjs';
          import { buildClaudeProjectionPlan } from './scripts/install-claude-adapter.mjs';
          const evidencePath = 'docs/fixtures/adapter-runtime-evidence.json';
          const profilesPath = 'docs/fixtures/adapter-runtime-profiles.json';
          const proofPath = 'docs/fixtures/verification-proof-policy-cases.json';
          const evidence = JSON.parse(readFileSync(evidencePath, 'utf8'));
          const profiles = JSON.parse(readFileSync(profilesPath, 'utf8'));
          const plans = { claude_code: buildClaudeProjectionPlan, codex: buildCodexProjectionPlan };
          for (const profile of profiles.profiles) {
            const plan = plans[profile.adapter_id]({ profileName: profile.rendering.renderer_profile });
            profile.profile_fingerprint = plan.fingerprint;
            profile.rendering.renderer_inputs = plan.renderer_inputs;
            profile.rendering.compact_profiles = plan.compactProfiles;
            for (const record of evidence.records) {
              if (record.evidence_kind === 'projection_manifest' && record.profile_id === profile.profile_id) record.profile_fingerprint = plan.fingerprint;
            }
          }
          const bytes = JSON.stringify(evidence, null, 2) + '\n';
          const digest = 'sha256:' + createHash('sha256').update(bytes).digest('hex');
          for (const profile of profiles.profiles) for (const capability of profile.capabilities) for (const reference of capability.evidence_refs ?? []) {
            if (reference.artifact_ref === evidencePath) reference.artifact_digest = digest;
          }
          const proof = JSON.parse(readFileSync(proofPath, 'utf8'));
          const proxy = proof.size_proxy.generated_localized_prompt;
          const prompt = profiles.profiles.find((profile) => profile.adapter_id === proxy.candidate_adapter_id).rendering.compact_profiles.find((profile) => profile.profile_id === proxy.candidate_profile_id);
          proxy.candidate_sha256 = prompt.rendered_sha256.replace(/^sha256:/, '');
          proxy.candidate_expected_bytes = prompt.rendered_bytes;
          writeFileSync(evidencePath, bytes);
          writeFileSync(profilesPath, JSON.stringify(profiles, null, 2) + '\n');
          writeFileSync(proofPath, JSON.stringify(proof, null, 2) + '\n');
          JS
      - name: Verify candidate on Node 24 with real source history
        run: |
          node --test scripts/test-codex-skill-reference-preflight.mjs scripts/test-skill-assets.mjs scripts/test-skill-reference-canonical.mjs scripts/test-ui-ux-adapter-assets.mjs docs/fixtures/ui-ux-design/fixture-state.test.mjs scripts/test-prompt-v2-historical-renderer.mjs
          node scripts/test-codex-risk-runner-scope.mjs
          node scripts/test-verification-proof-policy.mjs
          node scripts/adapter-runtime-bundle.mjs --check
          node scripts/validate-repo.mjs
          git diff --check
      # Publish tested blobs only. No branch, tag, commit, or PR is changed here.
      - name: Publish verified candidate blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const expected = {
            'scripts/ask-shared.mjs': '1728ef69a82a3e9ad4e6ac1afdd0636e023192b4bb0d523ea7a15c3fcf904755',
            'scripts/test-ui-ux-adapter-assets.mjs': '025d27292c089541558e36d8d9fc8b5833cdcc9151ab5ec8b7d7e89a710a854a',
            '.github/workflows/validate.yml': '9c725610c3f693235ec300e5f03760885e0223f77aea5884240fd6fc59a69dc1',
            'docs/fixtures/adapter-runtime-bundle.json': '020b30fe91810d063fecc97449c14a2f1d2c91fb5c73ed90f13df3ee2a3b8b35',
            'docs/fixtures/adapter-runtime-evidence.json': '4c97bd128f40715cdb30791ab249e541527ae40582c82c2717ebd802f5ab5421',
            'docs/fixtures/adapter-runtime-profiles.json': '2e36d98eff85846ebd1e9e147b84b460dab049a2282b09ba215fe965e650c3e9',
            'docs/fixtures/verification-proof-policy-cases.json': '00771e92505200266fc4ca48000c7673251ee8fb7066bb3596d2b5b2475b5251',
          };
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(changed, Object.keys(expected).sort());
          const result = { base_commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), node: process.version, tree_elements: [] };
          for (const [path, sha256] of Object.entries(expected)) {
            const bytes = readFileSync(path);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), sha256, path);
            const sha = createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
            const response = await fetch('https://api.github.com/repos/ist-h-i/agent-spectrum-kernel/git/blobs', {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content: bytes.toString('base64'), encoding: 'base64' }),
            });
            if (!response.ok) throw new Error(`Blob publication failed: ${response.status}`);
            assert.equal((await response.json()).sha, sha, path);
            result.tree_elements.push({ path, mode: '100644', type: 'blob', sha, sha256 });
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/ask-pr294-candidate-blobs.json`, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ask-pr294-candidate-blobs
          path: ${{ runner.temp }}/ask-pr294-candidate-blobs.json
          retention-days: 1
