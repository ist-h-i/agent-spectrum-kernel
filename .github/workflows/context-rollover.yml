name: Validate context rollover pilot

on:
  pull_request:

permissions:
  contents: read

jobs:
  context-rollover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Test runtime boundary and matched evaluation
        run: node --test scripts/test-context-rollover.mjs
      # Shared checkpoint/admission/schema/evidence tests are owned by Validate/common;
      # real-Git completion tests are owned by verification-completion. Require both
      # owner checks for PR completion; this workflow alone is not full verification.
      - name: Validate repository
        run: node scripts/validate-repo.mjs
      - name: Check whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
