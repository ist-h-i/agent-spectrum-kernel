name: Validate calibration input package

on:
  pull_request:
    paths:
      - '.github/workflows/validate-calibration-input-package.yml'
      - 'scripts/ask-benchmark-calibration-input-package.mjs'
      - 'scripts/test-ask-benchmark-calibration-input-package.mjs'
      - 'scripts/test-prompt-successor-scoring-fixtures.mjs'
      - 'scripts/ask-benchmark-prompt-successor-scoring-inputs.mjs'
      - 'scripts/ask-benchmark-admitted-fixture-invariance.mjs'
      - 'scripts/ask-benchmark-calibration-source.mjs'
      - 'scripts/ask-benchmark-atomic-publication.mjs'
      - 'scripts/ask-benchmark-duplicate-key-json.mjs'
      - 'scripts/ask-benchmark-stable-file.mjs'
      - 'scripts/ask-benchmark-source-session.mjs'
      - 'scripts/content-addressed-store.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check syntax and public input package boundaries
        run: |
          node --version
          node --check scripts/ask-benchmark-calibration-input-package.mjs
          node --test scripts/test-ask-benchmark-calibration-input-package.mjs
